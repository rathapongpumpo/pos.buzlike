services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: buzlike
      POSTGRES_USER: buzlike
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U buzlike -d buzlike']
      interval: 5s
      retries: 12
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://buzlike:${POSTGRES_PASSWORD}@db:5432/buzlike?schema=public
    ports:
      - '127.0.0.1:3100:3100'
    volumes:
      - slip-data:/app/data/slips
    depends_on:
      db:
        condition: service_healthy
  email-worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://buzlike:${POSTGRES_PASSWORD}@db:5432/buzlike?schema=public
    command: ["npm", "run", "email:worker"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
volumes:
  postgres-data:
  slip-data:
