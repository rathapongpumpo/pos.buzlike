# Install in the HTTPS site's http{} context; replace POS_DOMAIN and certificate paths.
# Do not add $request, $request_uri, $args, Referer, Cookie or Authorization to logs.
log_format pos_safe escape=json '{"at":"$time_iso8601","method":"$request_method","status":$status,"duration":$request_time,"requestId":"$request_id"}';
server {
  listen 80;
  server_name POS_DOMAIN;
  # Static Location prevents untrusted Host redirects. No URI is logged.
  access_log /var/log/nginx/pos-access.log pos_safe;
  error_log /dev/null crit;
  return 308 https://POS_DOMAIN$request_uri;
}
server {
  listen 443 ssl;
  server_name POS_DOMAIN;
  ssl_certificate /etc/letsencrypt/live/POS_DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/POS_DOMAIN/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  access_log /var/log/nginx/pos-access.log pos_safe;
  # Nginx upstream error messages can include full token-bearing request URLs.
  # Monitor HTTP status/timings and application structured errors instead.
  error_log /dev/null crit;
  client_max_body_size 6m;
  add_header Strict-Transport-Security "max-age=31536000" always;
  location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host POS_DOMAIN;
    proxy_set_header X-Forwarded-Host POS_DOMAIN;
    proxy_set_header X-Forwarded-Proto https;
    # Overwrite client-supplied forwarding headers used by application rate limits.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }
}
